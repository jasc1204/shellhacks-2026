<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GridLock finds where Dominion Energy South Carolina and Georgia Power plan transmission work close together in space and time, so they can share crews, equipment and right-of-way." />
    <title>GridLock · utility coordination finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">GRID<span>LOCK</span></span>
          <span class="tag">DESC <b>×</b> GEORGIA POWER · PLANNED TRANSMISSION WORK</span>
        </div>
        <div class="stats" id="stats"></div>
        <button class="world-link tour-btn" id="tour-btn" title="Guided tour of the top opportunities (arrow keys, Space, Esc)">▶ TOUR</button>
        <a class="world-link" id="world-link" href="#" hidden title="Fly through the border in 3D">3D WORLD ↗</a>
        <div class="method" role="group" aria-label="Distance method">
          <span class="micro">MEASURE</span>
          <button data-method="closest" class="on" title="GridLock spec: distance between the closest points of the two projects">CLOSEST POINTS</button>
          <button data-method="center" title="Sperry starter guide: distance between project center points, 25 mi cutoff">CENTERS</button>
        </div>
      </header>

      <main class="stage">
        <div id="map"></div>
        <div class="loading" id="loading"><span></span>LOADING THE BORDER…</div>
        <div class="hud legend" id="legend"></div>
        <div class="hud drawbar" id="drawbar" hidden></div>
        <div class="hud tourbar" id="tourbar" hidden></div>
        <div class="hud detail" id="detail" hidden></div>
        <div class="tooltip" id="tooltip" hidden></div>
      </main>

      <aside class="side">
        <nav class="tabs">
          <button data-tab="ranked" class="on">OPPORTUNITIES</button>
          <button data-tab="quality">DATA QUALITY</button>
          <button data-tab="about">ABOUT</button>
        </nav>
        <section class="panel" id="tab-ranked">
          <div class="userbox" id="userbox"></div>
          <div class="filters" id="filters"></div>
          <ol class="ranked" id="ranked"></ol>
        </section>
        <section class="panel" id="tab-quality" hidden></section>
        <section class="panel" id="tab-about" hidden></section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
